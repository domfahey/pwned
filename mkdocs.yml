site_name: pwned
site_description: CLI tool and typed Python client for the Have I Been Pwned API v3
site_url: https://domfahey.github.io/pwned/
repo_name: domfahey/pwned
repo_url: https://github.com/domfahey/pwned
edit_uri: edit/main/docs/
copyright: >-
  Code MIT Licensed &middot; Breach and paste data sourced from
  <a href="https://haveibeenpwned.com/">Have I Been Pwned</a> under
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: README.md
  - CLI Reference: cli-reference.md
  - HIBP API v3 Coverage: hibp-api-coverage.md
  - Python Library: python-api.md
  - Vault & AD Auditing: vault-auditing.md
  - Monitoring & CI/CD: monitoring-and-ci.md
  - Offline & Local MCP: offline-and-mcp.md
  - Roadmap: roadmap.md

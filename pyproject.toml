[project]
name = "pwned"
version = "0.5.0"
description = "CLI tool and Python client for the Have I Been Pwned API v3"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dominic Fahey" }]
keywords = ["haveibeenpwned", "hibp", "pwned", "security", "passwords", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
keepass = ["pykeepass>=4.0"]
keyring = ["keyring>=25.0"]
crypto = ["cryptography>=44.0"]
strength = ["zxcvbn>=4.4"]
all = ["pykeepass>=4.0", "keyring>=25.0", "cryptography>=44.0", "zxcvbn>=4.4"]

[project.urls]
Homepage = "https://github.com/domfahey/pwned"
Documentation = "https://domfahey.github.io/pwned/"
Repository = "https://github.com/domfahey/pwned"
Issues = "https://github.com/domfahey/pwned/issues"
Changelog = "https://github.com/domfahey/pwned/blob/main/CHANGELOG.md"

[project.scripts]
pwned = "pwned.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pwned"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.clusterfuzzlite",
    "/.dockerignore",
    "/.env.example",
    "/.github",
    "/.pre-commit-hooks.yaml",
    "/.python-version",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/Dockerfile",
    "/Makefile",
    "/action.yml",
    "/mkdocs.yml",
    "/packaging",
    "/site",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-httpx>=0.35",
    "ruff>=0.4",
    "mypy>=1.10",
]
docs = [
    "mkdocs-material>=9.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers"
markers = [
    "integration: marks tests that hit the live API",
]

[tool.mypy]
strict = true
files = ["src/pwned", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S324"]

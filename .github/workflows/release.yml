name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish container image for (e.g. v0.4.0)"
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: build and release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Verify tag matches package version
        run: |
          pkg_version=$(uv run --no-sync python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "v${pkg_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${pkg_version}" >&2
            exit 1
          fi
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest --cov=pwned --cov-branch --cov-fail-under=95 --cov-report=term-missing
      - run: uv build
      - name: Generate SHA256 checksums
        run: |
          (cd dist && sha256sum pwned-* > SHA256SUMS.txt)
      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Extract release notes from CHANGELOG.md
        run: |
          uv run --no-sync python - <<'PY'
          import os, pathlib, re

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[|\Z)"
          match = re.search(pattern, text, flags=re.M | re.S)
          notes = match.group(1).strip() if match else ""
          pathlib.Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s release-notes.md ]; then
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

  container:
    name: Build and Push Container Image
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Build and push multi-arch container image
        id: push
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user-binfmt
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${RELEASE_TAG#v}"
          docker buildx create --name pwned-builder --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --tag "${IMAGE_NAME}:${VERSION}" \
            --tag "${IMAGE_NAME}:latest" \
            --metadata-file /tmp/docker-metadata.json \
            .
          DIGEST=$(jq -r '.["containerimage.digest"]' /tmp/docker-metadata.json)
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Attest container image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
